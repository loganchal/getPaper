name: Ewald corpus probe

on:
  push:
    branches: [ai-ewald-scan-20260901]
    paths:
      - '.github/workflows/ewald-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact polymake file format
        shell: bash
        run: |
          set -euo pipefail
          url='http://polymake.org/polytopes/paffenholz/data/smooth-fano/d8/fano-v8d-0.tgz'
          curl -L --fail --retry 4 --retry-delay 2 "$url" -o /tmp/fano-v8d-0.tgz
          echo 'ARCHIVE'
          ls -lh /tmp/fano-v8d-0.tgz
          sha256sum /tmp/fano-v8d-0.tgz
          echo 'FILES'
          tar tzf /tmp/fano-v8d-0.tgz | wc -l
          echo 'FILE_000000'
          tar xOzf /tmp/fano-v8d-0.tgz fano.pnew.8D.000000.poly
          echo 'FILE_000001'
          tar xOzf /tmp/fano-v8d-0.tgz fano.pnew.8D.000001.poly
          echo 'FILE_005983_HEAD'
          tar xOzf /tmp/fano-v8d-0.tgz fano.pnew.8D.005983.poly | sed -n '1,260p'
