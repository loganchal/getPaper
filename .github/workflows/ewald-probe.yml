name: Ewald corpus probe

on:
  push:
    branches: [ai-ewald-scan-20260901]
    paths:
      - '.github/workflows/ewald-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve corpus archive URLs
        shell: bash
        run: |
          set -euo pipefail
          page='https://polymake.org/polytopes/paffenholz/www/fano.html'
          curl -L --fail --retry 4 --retry-delay 2 "$page" -o /tmp/fano.html
          echo 'PAGE_HEADERS_AND_SIZE'
          wc -c /tmp/fano.html
          echo 'DIM8_LINKS'
          grep -Eo 'href="[^"]*fano-v8d-[0-9]+\.(tgz|tar\.gz)"' /tmp/fano.html | sed -n '1,100p'
          echo 'CONTEXT'
          grep -n -C 2 'fano-v8d-0' /tmp/fano.html | sed -n '1,40p'
