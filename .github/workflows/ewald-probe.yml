name: Ewald corpus probe

on:
  push:
    branches: [ai-ewald-scan-20260901]
    paths:
      - '.github/workflows/ewald-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Benchmark exact scan on 1000 dimension-8 polytopes
        shell: bash
        run: |
          set -euo pipefail
          url='http://polymake.org/polytopes/paffenholz/data/smooth-fano/d8/fano-v8d-0.tgz'
          curl -L --fail --retry 4 --retry-delay 2 "$url" -o /tmp/fano-v8d-0.tgz
          /usr/bin/time -v python ewald_scan.py /tmp/fano-v8d-0.tgz --limit 1000 --output /tmp/result.json
          echo 'RESULT_SIZE'
          wc -c /tmp/result.json
