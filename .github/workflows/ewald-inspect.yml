name: Extract dimension-9 minimum-E record

on:
  push:
    branches: [ewald-search-20260901]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download 13-facet dimension-9 shard
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 \
            -o shard.gz \
            http://polymake.org/polytopes/paffenholz/data/smooth-fano/d9/fv-09-13p.gz
          sha256sum shard.gz > classification-13.sha256
      - name: Extract and independently recount E-points
        run: |
          python3 - <<'PY'
          import gzip, itertools, json

          target = 41977  # zero-based local record index from the full exact scan
          records = []
          current = None
          with gzip.open('shard.gz', 'rt', encoding='ascii') as f:
              for raw in f:
                  line = raw.strip()
                  if line == 'FACETS':
                      assert current is None
                      current = []
                  elif not line:
                      if current:
                          records.append(current)
                          if len(records) - 1 == target:
                              break
                          current = None
                  elif current is not None:
                      current.append(tuple(map(int, line.split())))
          assert len(records) - 1 == target, (len(records), target)
          rows = records[-1]
          assert len(rows) == 13
          assert all(len(r) == 10 and r[0] == 1 for r in rows)
          a = [r[1:] for r in rows]
          e = []
          for x in itertools.product((-1, 0, 1), repeat=9):
              if all(abs(sum(ui * xi for ui, xi in zip(u, x))) <= 1 for u in a):
                  e.append(x)
          assert len(e) == 1033, len(e)
          out = {
              'dimension': 9,
              'shard_facets': 13,
              'local_index_zero_based': target,
              'data_convention': '1 + a*x >= 0',
              'facet_rows': rows,
              'leq_normals_u_equals_minus_a': [tuple(-z for z in u) for u in a],
              'E_count': len(e),
              'E_points': e,
          }
          with open('d9-min-record.json', 'w') as f:
              json.dump(out, f, indent=2)
          with open('d9-min-record.facets', 'w') as f:
              f.write('FACETS\n')
              for r in rows:
                  f.write(' '.join(map(str, r)) + '\n')
          print(json.dumps({k: out[k] for k in ('dimension','shard_facets','local_index_zero_based','E_count')}, indent=2))
          print('LEQ_NORMALS')
          for u in out['leq_normals_u_equals_minus_a']:
              print(*u)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d9-minimum-E-record
          path: |
            classification-13.sha256
            d9-min-record.json
            d9-min-record.facets
