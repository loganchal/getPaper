name: Ewald classification scan

on:
  push:
    branches: [ewald-search-20260901]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact scanner
        run: g++ -std=c++20 -O3 -march=native -Wall -Wextra -pedantic ewald_scan.cpp -o ewald_scan
      - name: Download dimension-8 classification
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 \
            -o smooth_fano_8d.gz \
            http://polymake.org/polytopes/paffenholz/data/smooth-fano/d8/smooth_fano_8d.gz
          ls -lh smooth_fano_8d.gz
          sha256sum smooth_fano_8d.gz | tee classification.sha256
      - name: Scan all records exactly
        run: |
          set -o pipefail
          gzip -dc smooth_fano_8d.gz | ./ewald_scan -1 20 2> >(tee ewald_scan.log >&2)
      - name: Validate classification count and show summary
        run: |
          python3 - <<'PY'
          import json
          with open('ewald_scan_summary.json') as f:
              s = json.load(f)
          assert s['total'] == 749892, s
          print(json.dumps(s, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ewald-scan-dimension-8-full
          path: |
            classification.sha256
            ewald_scan_summary.json
            ewald_scan.log
            ewald_candidates.txt
