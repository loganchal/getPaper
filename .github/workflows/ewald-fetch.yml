name: Ewald classification fetch

on:
  push:
    branches:
      - ewald-search-scratch-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-dimension-nine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download complete dimension-9 classification
        shell: bash
        run: |
          set -euxo pipefail
          mkdir smoothfano9
          base=https://polymake.org/polytopes/paffenholz/data/smooth-fano/d9
          for n in $(seq 10 26); do
            f=fv-09-${n}p.gz
            curl -L --fail --retry 3 "$base/$f" -o "smoothfano9/$f"
          done
          sha256sum smoothfano9/*.gz > smoothfano9/SHA256SUMS
          : > smoothfano9/COUNTS
          for f in smoothfano9/*.gz; do
            printf '%s ' "$(basename "$f")" >> smoothfano9/COUNTS
            gzip -cd "$f" | grep -c '^FACETS$' >> smoothfano9/COUNTS
          done
          cat smoothfano9/COUNTS
          awk '{s+=$2} END {print "TOTAL",s}' smoothfano9/COUNTS
          du -ch smoothfano9/*.gz | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: smoothfano9-complete
          path: smoothfano9
          compression-level: 0
          retention-days: 1
