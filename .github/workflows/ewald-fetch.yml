name: Ewald classification fetch

on:
  push:
    branches:
      - ewald-search-scratch-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-dimension-nine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect dimension-9 source files
        shell: bash
        run: |
          set -euxo pipefail
          PAGE=https://polymake.org/polytopes/paffenholz/www/fano.html
          curl -L --fail --retry 3 -A 'Mozilla/5.0' "$PAGE" -o fano.html
          grep -oE 'href="[^"]*fv-09-[0-9]+p\.gz"' fano.html | sed -E 's/^href="//;s/"$//' > hrefs.txt
          python - <<'PY'
          from urllib.parse import urljoin
          base='https://polymake.org/polytopes/paffenholz/www/fano.html'
          for line in open('hrefs.txt'):
              print(urljoin(base,line.strip()))
          PY
          python - <<'PY' > urls.txt
          from urllib.parse import urljoin
          base='https://polymake.org/polytopes/paffenholz/www/fano.html'
          for line in open('hrefs.txt'):
              print(urljoin(base,line.strip()))
          PY
          : > heads.txt
          while read -r u; do
            echo "===== $u =====" | tee -a heads.txt
            curl -L --fail --retry 3 -sSI "$u" | grep -Ei '^(HTTP/|content-length:|last-modified:|etag:)' | tee -a heads.txt
          done < urls.txt
          first=$(head -1 urls.txt)
          curl -L --fail --retry 3 "$first" -o sample.gz
          gzip -dc sample.gz | head -80 > sample.txt || true
          ls -lh sample.gz >> heads.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smoothfano9-inspection
          path: |
            fano.html
            hrefs.txt
            urls.txt
            heads.txt
            sample.gz
            sample.txt
          compression-level: 0
          retention-days: 1
