name: Ewald data bridge

on:
  push:
    branches:
      - ewald-search-temp

permissions:
  contents: read

jobs:
  fetch-classification:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official dimension-8 smooth Fano classification
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            --output smoothfano8.tar.gz \
            https://magma.maths.usyd.edu.au/magma/download/db/smoothfano8.tar.gz
          echo 'c6f793461f67efcf62c1f6af83033eaa  smoothfano8.tar.gz' | md5sum --check --strict
          tar -tzf smoothfano8.tar.gz > archive-members.txt
          ls -lh smoothfano8.tar.gz
          cat archive-members.txt
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: smoothfano8-official
          path: |
            smoothfano8.tar.gz
            archive-members.txt
          if-no-files-found: error
          retention-days: 1
