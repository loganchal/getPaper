name: Ewald dimension-8 search

on:
  push:
    branches: [ewald-d8-search]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch classification
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import urlopen

          page = "https://polymake.org/polytopes/paffenholz/www/fano.html"
          html = urlopen(page, timeout=60).read().decode("utf-8")
          Path("fano.html").write_text(html, encoding="utf-8")

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href: self.links.append(href)

          p = Links(); p.feed(html)
          matches = [urljoin(page, h) for h in p.links if "smooth_fano_8d.gz" in h]
          print("archive links:", matches)
          if len(matches) != 1:
              raise SystemExit(f"expected one archive link, found {len(matches)}")
          data = urlopen(matches[0], timeout=300).read()
          Path("smooth_fano_8d.gz").write_bytes(data)
          print("downloaded", len(data), "bytes from", matches[0])
          PY
          ls -lh smooth_fano_8d.gz
      - name: Probe archive
        run: python ewald_search/probe.py
      - name: Upload probe and archive
        uses: actions/upload-artifact@v4
        with:
          name: smooth-fano-8d-probe
          path: |
            probe.json
            probe_head.txt
            smooth_fano_8d.gz
          retention-days: 1
          compression-level: 0
